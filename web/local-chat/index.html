<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NanoClaw — Local Chat</title>
    <style>
      :root {
        --bg: #f7f7f8;
        --panel: #ffffff;
        --border: #e5e5e7;
        --text: #1a1a1a;
        --muted: #6b7280;
        --accent: #2563eb;
        --you-bg: #2563eb;
        --you-fg: #ffffff;
        --agent-bg: #ececef;
        --agent-fg: #1a1a1a;
        --status-ok: #16a34a;
        --status-bad: #dc2626;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #18181b;
          --panel: #1f1f23;
          --border: #2e2e35;
          --text: #ececec;
          --muted: #9ca3af;
          --agent-bg: #2a2a31;
          --agent-fg: #ececec;
        }
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
        display: flex;
        flex-direction: column;
        height: 100vh;
      }
      header {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 16px;
        background: var(--panel);
        border-bottom: 1px solid var(--border);
      }
      header h1 {
        font-size: 15px;
        font-weight: 600;
        margin: 0;
      }
      header .status {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        color: var(--muted);
        margin-left: auto;
      }
      header .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--status-bad);
      }
      header .dot.ok { background: var(--status-ok); }
      main {
        flex: 1;
        overflow-y: auto;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .msg {
        max-width: 80%;
        padding: 10px 14px;
        border-radius: 14px;
        white-space: pre-wrap;
        word-wrap: break-word;
        line-height: 1.45;
      }
      .msg.you {
        align-self: flex-end;
        background: var(--you-bg);
        color: var(--you-fg);
        border-bottom-right-radius: 4px;
      }
      .msg.agent {
        align-self: flex-start;
        background: var(--agent-bg);
        color: var(--agent-fg);
        border-bottom-left-radius: 4px;
      }
      .empty {
        color: var(--muted);
        text-align: center;
        margin: auto;
        font-size: 14px;
      }
      footer {
        padding: 12px 16px;
        background: var(--panel);
        border-top: 1px solid var(--border);
      }
      .composer {
        display: flex;
        gap: 8px;
        align-items: flex-end;
      }
      textarea {
        flex: 1;
        resize: none;
        min-height: 44px;
        max-height: 160px;
        padding: 10px 12px;
        border: 1px solid var(--border);
        border-radius: 10px;
        font: inherit;
        background: var(--bg);
        color: var(--text);
      }
      textarea:focus {
        outline: 2px solid var(--accent);
        outline-offset: -1px;
      }
      button {
        padding: 10px 16px;
        background: var(--accent);
        color: white;
        border: 0;
        border-radius: 10px;
        font: inherit;
        font-weight: 500;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .hint {
        font-size: 11px;
        color: var(--muted);
        margin-top: 6px;
        text-align: right;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>NanoClaw</h1>
      <span class="status">
        <span id="dot" class="dot"></span>
        <span id="status-text">connecting…</span>
      </span>
    </header>

    <main id="messages">
      <div class="empty" id="empty">Send a message to start.</div>
    </main>

    <footer>
      <form class="composer" id="composer">
        <textarea
          id="input"
          placeholder="Message…"
          autocomplete="off"
          autofocus
          rows="1"
        ></textarea>
        <button type="submit" id="send">Send</button>
      </form>
      <div class="hint">Enter to send · Shift+Enter for newline</div>
    </footer>

    <script>
      const $messages = document.getElementById('messages');
      const $empty = document.getElementById('empty');
      const $form = document.getElementById('composer');
      const $input = document.getElementById('input');
      const $send = document.getElementById('send');
      const $dot = document.getElementById('dot');
      const $statusText = document.getElementById('status-text');

      let cursor = 0;
      let online = false;

      function setOnline(ok) {
        if (ok === online) return;
        online = ok;
        $dot.classList.toggle('ok', ok);
        $statusText.textContent = ok ? 'connected' : 'offline';
      }

      function addMessage(text, who) {
        if ($empty) {
          $empty.remove();
        }
        const div = document.createElement('div');
        div.className = `msg ${who}`;
        div.textContent = text;
        $messages.appendChild(div);
        $messages.scrollTop = $messages.scrollHeight;
      }

      async function poll() {
        try {
          const res = await fetch(`/api/messages?since=${cursor}`, { cache: 'no-store' });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const data = await res.json();
          setOnline(true);
          for (const m of data.messages || []) {
            addMessage(m.text, 'agent');
          }
          if (typeof data.cursor === 'number') cursor = data.cursor;
        } catch (err) {
          setOnline(false);
        }
      }

      async function send(text) {
        $send.disabled = true;
        try {
          const res = await fetch('/api/messages', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ text }),
          });
          if (!res.ok) {
            const body = await res.text();
            addMessage(`[error: ${res.status} ${body}]`, 'agent');
            return false;
          }
          return true;
        } catch (err) {
          addMessage(`[network error: ${err.message}]`, 'agent');
          return false;
        } finally {
          $send.disabled = false;
        }
      }

      $form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const text = $input.value.trim();
        if (!text) return;
        addMessage(text, 'you');
        $input.value = '';
        autoResize();
        await send(text);
      });

      $input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          $form.requestSubmit();
        }
      });

      function autoResize() {
        $input.style.height = 'auto';
        $input.style.height = Math.min($input.scrollHeight, 160) + 'px';
      }
      $input.addEventListener('input', autoResize);

      // Kick off the poll loop. 1s is fine for human-perceived "instant" —
      // upgrade to SSE later if needed.
      poll();
      setInterval(poll, 1000);
    </script>
  </body>
</html>
